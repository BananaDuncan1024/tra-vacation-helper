<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>請假申請系統</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        /* ===== 頂部導航 ===== */
        .header {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 56px;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a73e8;
            margin-right: 32px;
            white-space: nowrap;
        }
        .header-nav {
            display: flex;
            gap: 4px;
            height: 100%;
        }
        .header-nav a {
            display: flex;
            align-items: center;
            padding: 0 16px;
            color: #5f6368;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: color 0.2s, border-color 0.2s;
            height: 100%;
        }
        .header-nav a:hover {
            color: #1a73e8;
            background-color: #f8f9fa;
        }
        .header-nav a.active {
            color: #1a73e8;
            border-bottom-color: #1a73e8;
        }
        /* ===== 主體區域 ===== */
        .main {
            max-width: 560px;
            margin: 32px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
            padding: 32px;
            margin-bottom: 20px;
        }
        .card h2 {
            color: #202124;
            font-size: 20px;
            margin-bottom: 24px;
            text-align: center;
        }
        /* ===== 表單 ===== */
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            color: #3c4043;
            font-weight: 500;
            font-size: 14px;
        }
        label .required { color: #ea4335; margin-left: 2px; }
        input[type="text"],
        input[type="date"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 15px;
            color: #202124;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
        }
        input.error, select.error { border-color: #ea4335; }
        .error-message {
            color: #ea4335;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        .error-message.show { display: block; }
        /* ===== 按鈕組 ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s, opacity 0.2s;
            text-align: center;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary {
            background-color: #1a73e8;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #1557b0;
            box-shadow: 0 2px 6px rgba(26,115,232,0.3);
        }
        .btn-save {
            background-color: #e8f0fe;
            color: #1a73e8;
            border: 1px solid #d2e3fc;
        }
        .btn-save:hover:not(:disabled) {
            background-color: #d2e3fc;
        }
        /* ===== 提示 ===== */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s;
        }
        .alert.show { display: block; }
        .alert-success { background: #e6f4ea; color: #1e8e3e; border: 1px solid #ceead6; }
        .alert-error { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6cb; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        /* ===== Radio 按鈕組 ===== */
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .radio-group input[type="radio"] { display: none; }
        .radio-group label {
            display: inline-block;
            padding: 8px 16px;
            border: 1.5px solid #dadce0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #5f6368;
            background: white;
            transition: all 0.15s;
            margin-bottom: 0;
        }
        .radio-group input[type="radio"]:checked + label {
            background: #1a73e8;
            border-color: #1a73e8;
            color: white;
        }
        .radio-group label:hover { border-color: #1a73e8; color: #1a73e8; }
        .radio-group input[type="radio"]:checked + label:hover { color: white; }
        /* ===== Checkbox ===== */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            background: #fff8e1;
            border: 1.5px solid #f9a825;
            border-radius: 8px;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; cursor: pointer;
        }
        .checkbox-group span {
            font-size: 14px; color: #5f3b00; line-height: 1.4;
        }
        /* ===== 提示 ===== */
        .hint {
            text-align: center;
            color: #80868b;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="header-title">📝 請假系統</div>
            <nav class="header-nav">
                <a href="/" class="active">請假申請</a>
                <a href="/schedule">排程管理</a>
            </nav>
        </div>
    </div>

    <div class="main">
        <!-- 提示訊息 -->
        <div class="alert alert-success" id="successAlert"></div>
        <div class="alert alert-error" id="errorAlert"></div>

        <div class="card">
            <h2>請假申請</h2>
            <form id="leaveForm" novalidate>
                <div class="form-group">
                    <label for="name">姓名<span class="required">*</span></label>
                    <input type="text" id="name" name="name" placeholder="請輸入姓名" required>
                    <div class="error-message" id="name-error">請輸入姓名</div>
                </div>

                <div class="form-group">
                    <label for="employee_id">員工代號<span class="required">*</span></label>
                    <input type="text" id="employee_id" name="employee_id" placeholder="請輸入員工代號" required>
                    <div class="error-message" id="employee_id-error">請輸入員工代號</div>
                </div>

                <div class="form-group">
                    <label>近假/長假<span class="required">*</span></label>
                    <div class="radio-group" id="leave_category_group">
                        <input type="radio" name="leave_category" id="cat_近假" value="近假">
                        <label for="cat_近假">近假</label>
                        <input type="radio" name="leave_category" id="cat_長假" value="長假">
                        <label for="cat_長假">長假</label>
                        <input type="radio" name="leave_category" id="cat_長假號碼牌" value="長假號碼牌">
                        <label for="cat_長假號碼牌">長假號碼牌</label>
                        <input type="radio" name="leave_category" id="cat_取消" value="取消">
                        <label for="cat_取消">取消</label>
                    </div>
                    <div class="error-message" id="leave_category-error">請選擇近假或長假</div>
                </div>

                <div class="form-group">
                    <label for="leave_type">假別</label>
                    <select id="leave_type" name="leave_type">
                        <option value="">選擇假別（可不選）</option>
                        <option value="補休">補休</option>
                        <option value="特休">特休</option>
                        <option value="事假">事假</option>
                        <option value="家庭照顧假">家庭照顧假</option>
                        <option value="身心調適假">身心調適假</option>
                        <option value="病假">病假</option>
                        <option value="生理假">生理假</option>
                        <option value="婚假">婚假</option>
                        <option value="產前假">產前假</option>
                        <option value="娩假">娩假</option>
                        <option value="流產假">流產假</option>
                        <option value="降產檢及降產假">降產檢及降產假</option>
                        <option value="喪假">喪假</option>
                        <option value="公假">公假</option>
                        <option value="公出">公出</option>
                        <option value="其他">其他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="start_date">請假起點日期<span class="required">*</span></label>
                    <input type="date" id="start_date" name="start_date" required>
                    <div class="error-message" id="start_date-error">請選擇請假起點日期</div>
                </div>

                <div class="form-group">
                    <label for="end_date">請假終點日期<span class="required">*</span></label>
                    <input type="date" id="end_date" name="end_date" required>
                    <div class="error-message" id="end_date-error">請選擇請假終點日期</div>
                </div>

                <div class="form-group">
                    <label for="password">請假密碼<span class="required">*</span></label>
                    <input type="password" id="password" name="password" placeholder="請輸入請假密碼" required>
                    <div class="error-message" id="password-error">請輸入請假密碼</div>
                </div>

                <div class="form-group">
                    <label id="confirmation-label">確認填寫內咁<span class="required">*</span></label>
                    <div class="checkbox-group" onclick="toggleConfirmation()">
                        <input type="checkbox" id="confirmation" name="confirmation">
                        <span>我確認了（請再次確認填寫內咁正確）</span>
                    </div>
                    <div class="error-message" id="confirmation-error">請勾選確認欄位才可提交</div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary" id="submitBtn">🚀 立即提交</button>
                    <button type="button" class="btn btn-save" id="saveBtn">💾 保存資料</button>
                </div>
                <div class="hint">保存的資料可在「排程管理」中用於定時提交</div>
            </form>
        </div>
    </div>

    <script>
        const fields = ['name', 'employee_id', 'start_date', 'end_date', 'password'];

        function toggleConfirmation() {
            const cb = document.getElementById('confirmation');
            cb.checked = !cb.checked;
        }

        // ===== 工具 =====
        function showAlert(type, msg) {
            const el = document.getElementById(type === 'success' ? 'successAlert' : 'errorAlert');
            const other = document.getElementById(type === 'success' ? 'errorAlert' : 'successAlert');
            other.classList.remove('show');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 6000);
        }

        function validateForm() {
            let isValid = true;
            // Clear text field errors
            fields.forEach(function(field) {
                document.getElementById(field).classList.remove('error');
                document.getElementById(field + '-error').classList.remove('show');
            });
            document.getElementById('leave_category-error').classList.remove('show');
            document.getElementById('confirmation-error').classList.remove('show');

            // Validate text fields
            fields.forEach(function(field) {
                const input = document.getElementById(field);
                if (!input.value.trim()) {
                    input.classList.add('error');
                    document.getElementById(field + '-error').classList.add('show');
                    isValid = false;
                }
            });

            // Validate leave_category radio
            const catSelected = document.querySelector('input[name="leave_category"]:checked');
            if (!catSelected) {
                document.getElementById('leave_category-error').classList.add('show');
                isValid = false;
            }

            // Validate date logic
            const startDate = document.getElementById('start_date').value;
            const endDate = document.getElementById('end_date').value;
            if (startDate && endDate && new Date(endDate) < new Date(startDate)) {
                document.getElementById('end_date').classList.add('error');
                const errorEl = document.getElementById('end_date-error');
                errorEl.textContent = '請假終點日期不可早於起點日期';
                errorEl.classList.add('show');
                isValid = false;
            }

            // Validate confirmation checkbox
            if (!document.getElementById('confirmation').checked) {
                document.getElementById('confirmation-error').classList.add('show');
                isValid = false;
            }

            return isValid;
        }

        function getFormData() {
            const catEl = document.querySelector('input[name="leave_category"]:checked');
            return {
                name: document.getElementById('name').value.trim(),
                employee_id: document.getElementById('employee_id').value.trim(),
                leave_category: catEl ? catEl.value : '',
                leave_type: document.getElementById('leave_type').value,
                start_date: document.getElementById('start_date').value,
                end_date: document.getElementById('end_date').value,
                password: document.getElementById('password').value.trim(),
            };
        }

        // ===== 立即提交 =====
        document.getElementById('leaveForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!validateForm()) return;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '提交中...';

            try {
                const resp = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(getFormData()),
                });
                const data = await resp.json();
                if (data.success) {
                    showAlert('success', '✅ 提交成功！' + (data.message || ''));
                } else {
                    showAlert('error', '提交失敗: ' + (data.message || '未知錯誤'));
                }
            } catch (err) {
                showAlert('error', '網路錯誤: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 立即提交';
            }
        });

        // ===== 保存資料 =====
        document.getElementById('saveBtn').addEventListener('click', async function() {
            if (!validateForm()) return;

            const btn = this;
            btn.disabled = true;
            btn.textContent = '保存中...';

            const formData = getFormData();
            // 建立識別標籤
            formData.label = formData.name + ' - ' + (formData.leave_category || '') +
                (formData.leave_type ? '/' + formData.leave_type : '') +
                ' (' + formData.start_date + ')';

            try {
                const resp = await fetch('/api/saved', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData),
                });
                const data = await resp.json();
                if (data.success) {
                    showAlert('success', '💾 資料已保存（ID: ' + data.id + '），可前往排程管理設定定時提交');
                } else {
                    showAlert('error', '保存失敗: ' + (data.message || '未知錯誤'));
                }
            } catch (err) {
                showAlert('error', '網路錯誤: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 保存資料';
            }
        });

        // ===== 清除錯誤 =====
        document.querySelectorAll('input[type="text"], input[type="date"], input[type="password"], select').forEach(function(el) {
            el.addEventListener('input', function() {
                this.classList.remove('error');
                const errEl = document.getElementById(this.id + '-error');
                if (errEl) errEl.classList.remove('show');
            });
        });
        document.querySelectorAll('input[name="leave_category"]').forEach(function(el) {
            el.addEventListener('change', function() {
                document.getElementById('leave_category-error').classList.remove('show');
            });
        });
        document.getElementById('confirmation').addEventListener('change', function() {
            document.getElementById('confirmation-error').classList.remove('show');
        });
    </script>
</body>
</html>
